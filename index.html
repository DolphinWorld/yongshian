<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Emergent Property (涌现 Yongshian)</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="setup-panel" id="settingsPanel" aria-label="Settings">
        <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-label="Toggle settings">
          <span class="settings-title">
            <strong>涌现</strong>
            <small id="settingsSummary">Review model and key setup</small>
          </span>
          <span class="settings-actions">
            <em id="settingsIndicator" aria-hidden="true"></em>
            <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </span>
        </button>

        <div class="sidebar-nav" aria-hidden="true">
          <span>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            New Chat
          </span>
          <span>
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
            Models
          </span>
          <span>
            <svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 1 5.7-2.4L21 21" /></svg>
            Search
          </span>
        </div>

        <div class="settings-body" id="settingsBody">
          <label class="field">
            <span>Summarizer</span>
            <select id="summarizerSelect"></select>
          </label>

          <label class="field">
            <span>Max debate rounds</span>
            <input id="roundsInput" type="number" min="1" max="5" value="3" />
          </label>

          <label class="field">
            <span>Bias control</span>
            <select id="biasSelect">
              <option value="single">Single summarizer</option>
              <option value="rotating">Rotate summarizer by round</option>
              <option value="check">Multi-summary check</option>
            </select>
          </label>

          <div class="model-list-header">
            <span>Models</span>
            <button id="ollamaRefreshButton" class="tiny-button" type="button">Refresh Ollama</button>
          </div>
          <div class="ollama-status" id="ollamaStatus">Ollama not checked yet</div>
          <div class="model-list" id="modelList"></div>
        </div>
      </aside>

      <section class="workspace" id="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow">Multi-model discussion</p>
            <h1>AI Emergent Property <span>(涌现 Yongshian)</span></h1>
          </div>
          <div class="run-state" id="runState">Ready</div>
        </section>

        <section class="chat-canvas">
          <section class="composer-panel" aria-label="Prompt composer">
            <div class="prompt-row">
              <label class="prompt-field">
                <span class="prompt-label-row">
                  <span>What can I help with?</span>
                  <span class="session-toggle">
                    <input id="continueSessionInput" type="checkbox" checked />
                    <span>Continue session</span>
                  </span>
                </span>
                <textarea id="promptInput" placeholder="Ask several AI models to discuss a question, compare options, or debate a decision."></textarea>
              </label>
              <button id="runButton" class="primary-button" type="button" aria-label="Start discussion">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3.5c2.6 0 4.9 1.1 6.5 2.8 1.4 1.5 2.1 3.3 2.1 5.2 0 4.2-3.8 7.8-8.6 7.8-.8 0-1.6-.1-2.3-.3l-4.1 1.5 1.1-3.5c-2-1.4-3.3-3.4-3.3-5.7 0-4.3 3.9-7.8 8.6-7.8Z" />
                  <path d="M8.3 11.4h7.4M12 7.8v7.4" />
                </svg>
              </button>
            </div>
          </section>

          <section class="main-panel">
            <div class="activity-panel hidden" id="activityPanel">
              <div class="activity-heading">
                <span id="progressStatus">Ready</span>
                <button id="clearButton" type="button">Clear</button>
              </div>
              <div class="progress-track" aria-label="Discussion progress">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div id="activityLog" class="activity-log"></div>
            </div>

            <div class="final-panel hidden" id="finalPanel">
              <div id="finalSummary" class="final-summary"></div>
              <div id="modelDetails" class="model-details"></div>
            </div>
          </section>
        </section>
      </section>

      <footer class="cost-bar" aria-label="Cost status">
        <span>Est. <strong id="estimatedCost">$0.0000</strong></span>
        <span>Round <strong id="roundDelta">$0.0000</strong></span>
        <span>Total <strong id="processTotal">$0.0000</strong></span>
      </footer>
    </main>

    <script src="src/app.js" type="module"></script>
  </body>
</html>
