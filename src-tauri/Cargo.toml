[package]
name = "ai-council"
version = "0.1.0"
description = "Local-first AI discussion orchestrator"
authors = ["Yongshian"]
edition = "2021"

[lib]
name = "ai_council_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
